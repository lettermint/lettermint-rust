name: Update Changelog

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update changelog from release notes
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      - name: Open changelog pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-changelog
          commit-message: Update CHANGELOG
          title: Update changelog from release notes
          body: Add the published release notes to CHANGELOG.md. This change requires review before merge.
          add-paths: CHANGELOG.md
