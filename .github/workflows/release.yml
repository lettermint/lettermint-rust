name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish crate
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Download tested package
        uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify release package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$version" = "$package_version"
          test -f "artifacts/lettermint-${version}.crate"
          tar -tzf "artifacts/lettermint-${version}.crate" | grep -q "lettermint-${version}/Cargo.toml.orig"
          tar -tzf "artifacts/lettermint-${version}.crate" | grep -q "lettermint-${version}/src/lib.rs"
          sha256sum "artifacts/lettermint-${version}.crate"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  changelog:
    needs: publish
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/update-changelog.yml

  discord:
    needs: publish
    uses: ./.github/workflows/release-to-discord.yml
    secrets:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
